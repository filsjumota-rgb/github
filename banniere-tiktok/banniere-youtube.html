<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<title>Miniature YouTube Motion Design</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:ital,wght@0,800;1,900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:720px;background:#1a0f6e}
.c{position:relative;width:1280px;height:720px;overflow:hidden;font-family:Anton,sans-serif;
  background:radial-gradient(circle at 75% 40%,#6a3dff 0%,#3a1fd0 35%,#1d0f8a 75%,#120860 100%)}
.stripe{position:absolute;width:360px;height:1400px;top:-300px;background:linear-gradient(#ffffff10,#ffffff04);transform:rotate(28deg)}
.ring{position:absolute;border:3px solid #ffffff22;border-radius:50%}
.logo{position:absolute;top:28px;left:36px;background:#fff;border-radius:24px;padding:8px 22px 8px 10px;
  display:flex;align-items:center;gap:10px;box-shadow:0 10px 26px #0006}
.logo img{width:62px;height:62px;object-fit:contain}
.logo span{font-family:Montserrat;font-weight:800;font-size:30px;color:#0b1430;line-height:1}
.logo span b{color:#1a73ff}
.band{position:absolute;top:140px;left:-40px;width:840px;height:170px;background:#0a0a14;transform:rotate(-4deg);
  box-shadow:0 16px 40px #0007;display:flex;align-items:center;justify-content:center;padding-left:40px}
.band h1{font-size:132px;letter-spacing:1px;color:#fff;line-height:1;text-shadow:5px 6px 0 #000;white-space:nowrap}
.band h1 em{font-style:normal;color:#ffd21f}
.tag{position:absolute;top:322px;left:90px;transform:rotate(-3deg);background:#ffd21f;padding:4px 28px 8px;
  font-size:78px;color:#0a0a14;line-height:1.05;box-shadow:9px 9px 0 #0a0a14;white-space:nowrap}
.sub{position:absolute;top:448px;left:44px;font-family:Montserrat;font-weight:900;font-style:italic;
  font-size:36px;color:#fff;text-shadow:3px 4px 0 #0a0a14;transform:rotate(-2deg);white-space:nowrap}
.panel{position:absolute;top:532px;left:40px;width:700px;height:160px;border:4px solid #ffd21f;border-radius:24px;
  background:#120a4ccc;box-shadow:12px 12px 0 #0a0a14;padding:14px 18px;display:flex;justify-content:space-between}
.it{display:flex;flex-direction:column;align-items:center;gap:8px;width:120px}
.ic{width:96px;height:96px;border-radius:22px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px #0006}
.it p{font-family:Montserrat;font-weight:800;font-size:19px;color:#fff;white-space:nowrap}
.frame{position:absolute;left:800px;top:150px;width:430px;height:640px;border:12px solid #ffd21f;border-radius:34px;background:#2a17a8}
.person{position:absolute;left:720px;top:60px;width:620px;
  filter:drop-shadow(8px 0 0 #fff) drop-shadow(-8px 0 0 #fff) drop-shadow(0 8px 0 #fff) drop-shadow(0 -8px 0 #fff) drop-shadow(0 20px 34px #0008)}
.cta{position:absolute;right:28px;top:40px;background:#ff2d55;color:#fff;font-size:48px;line-height:1;padding:14px 22px;border-radius:18px;
  transform:rotate(6deg);box-shadow:8px 8px 0 #0a0a14;text-align:center}
.cta small{display:block;font-family:Montserrat;font-weight:800;font-size:20px;margin-top:4px}
</style></head>
<body><div class="c">
  <div class="stripe" style="left:-200px"></div><div class="stripe" style="left:520px;opacity:.7"></div>
  <div class="ring" style="width:200px;height:200px;left:560px;top:-60px"></div>
  <div class="ring" style="width:260px;height:260px;left:-120px;top:480px"></div>

  <div class="logo"><img src="logo-icone.png" alt=""><span>Jumota <b>Agency</b></span></div>

  <div class="band"><h1><em>MOTION</em> DESIGN</h1></div>
  <div class="tag">FACILE &amp; RAPIDE</div>
  <div class="sub">ANIME TES VIDÉOS COMME UN PRO</div>

  <div class="panel">
    <div class="it"><div class="ic" style="background:#ff4d6d">
      <svg width="58" height="58" viewBox="0 0 24 24" fill="#fff"><path d="M12 2l3 7h7l-5.5 4.5 2 7.5L12 16.5 5.5 21l2-7.5L2 9h7z"/></svg></div><p>Animation</p></div>
    <div class="it"><div class="ic" style="background:#ffd21f">
      <svg width="58" height="58" viewBox="0 0 24 24" fill="none" stroke="#0a0a14" stroke-width="2.6" stroke-linecap="round"><path d="M3 20C8 20 9 4 21 4"/><circle cx="3" cy="20" r="1.8" fill="#0a0a14"/><circle cx="21" cy="4" r="1.8" fill="#0a0a14"/></svg></div><p>Courbes</p></div>
    <div class="it"><div class="ic" style="background:#fff">
      <svg width="58" height="58" viewBox="0 0 24 24" fill="#3a1fd0"><path d="M12 2l5 10-5 10-5-10z"/></svg></div><p>Keyframes</p></div>
    <div class="it"><div class="ic" style="background:#00c2a8">
      <svg width="58" height="58" viewBox="0 0 24 24" fill="#fff"><rect x="2" y="5" width="20" height="3" rx="1.5"/><rect x="6" y="10.5" width="14" height="3" rx="1.5"/><rect x="2" y="16" width="11" height="3" rx="1.5"/></svg></div><p>Timeline</p></div>
    <div class="it"><div class="ic" style="background:#1a73ff">
      <svg width="58" height="58" viewBox="0 0 24 24" fill="#fff"><path d="M3 7h3l2-3h8l2 3h3v13H3z"/><circle cx="12" cy="13" r="4" fill="#1a73ff"/></svg></div><p>Effets</p></div>
  </div>

  <div class="frame"></div>
  <img class="person" src="personne.png" alt="">
  <div class="cta">TUTO<small>pas à pas</small></div>
</div></body></html>
